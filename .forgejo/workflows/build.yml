name: Build Corewallet

on:
  push:
    branches: [ "main" ]       # alleen main auto
  workflow_dispatch:            # handmatig vanaf andere branches

jobs:
  build:
    runs-on: self-hosted        # vervang door label dat jouw runner echt heeft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libtool \
            autotools-dev \
            automake \
            pkg-config \
            python3 \
            git \
            bsdmainutils \
            libssl-dev \
            libevent-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libboost-chrono-dev \
            libboost-program-options-dev \
            libboost-test-dev \
            libboost-thread-dev \
            libzmq3-dev \
            libminiupnpc-dev \
            ca-certificates \
            wget

      - name: Build Berkeley DB 4.8
        run: |
          set -e
          export BDB_PREFIX="/usr/local/bdb48"
          cd "$GITHUB_WORKSPACE"
          wget -O db-4.8.30.NC.tar.gz "https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz"
          tar -xzvf db-4.8.30.NC.tar.gz
          sed -i 's/__atomic_compare_exchange/db___atomic_compare_exchange/g' db-4.8.30.NC/dbinc/atomic.h
          cd db-4.8.30.NC/build_unix
          ../dist/configure --enable-cxx --disable-shared --with-pic --prefix="$BDB_PREFIX"
          make -j"$(nproc)"
          sudo make install

      - name: Build corewallet
        env:
          BDB_PREFIX: /usr/local/bdb48
        run: |
          export BDB_CFLAGS="-I$BDB_PREFIX/include"
          export BDB_LIBS="-L$BDB_PREFIX/lib -ldb_cxx-4.8"
          cd "$GITHUB_WORKSPACE"
          ./autogen.sh
          ./configure \
            --with-boost-libdir=/usr/lib/x86_64-linux-gnu \
            --without-gui \
            --with-incompatible-bdb \
            CPPFLAGS="$BDB_CFLAGS" \
            LDFLAGS="$BDB_LIBS"
          make -j"$(nproc)"
          strip src/eguldend src/egulden-cli || true

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: corewallet-binaries
          path: |
            src/eguldend
            src/egulden-cli
            config.log
            config.status
