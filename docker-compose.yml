services:
  egulden-core:
    network_mode: host
    image: communitycoins/egulden-core:24.04
    container_name: cc-egulden-core
    restart: unless-stopped
    volumes:
      - /var/CC/data/e-Gulden:/data

    command:
      - eguldend
      - -debug=net
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=rot
      - -rpcpassword=rot
      - -datadir=/data/blockchain

  rot:
    image: communitycoins/rot:latest
    container_name: cc-egulden-rot
    restart: no
    network_mode: host
    volumes:
      - /var/CC/data/e-Gulden:/data
    depends_on:
      - egulden-core
    environment:
      CORE_RPC_HOST: 127.0.0.1
      CORE_RPC_PORT: 21015
      CORE_RPC_USER: rot
      CORE_RPC_PASSWORD: rot
      CORE_DATA_DIR: /data/blockchain
      ROT_DATA_DIR: /data/rot
      ROT_LISTEN_ADDR: 11014
      ROT_COIN_TIKKER: EFL

    command: >
      php
        -d memory_limit=2G
        -d error_log=/data/rot/rot_egulden.log
        -d log_errors=1
        -d error_reporting=E_ALL
        -d display_errors=1
        /usr/local/bin/rot.php
