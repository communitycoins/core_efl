image: ubuntu:24.04

stages:
  - build

build:ubuntu-24.04:
  stage: build
  variables:
    COIN_NAME: "egulden"
    BDB_PREFIX: "/usr/local/bdb48"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends \
        build-essential \
        libtool \
        autotools-dev \
        automake \
        pkg-config \
        python3 \
        git \
        bsdmainutils \
        libssl-dev \
        libevent-dev \
        libboost-system-dev \
        libboost-filesystem-dev \
        libboost-chrono-dev \
        libboost-program-options-dev \
        libboost-test-dev \
        libboost-thread-dev \
        libzmq3-dev \
        libminiupnpc-dev \
        ca-certificates \
        wget
    # hexdump safety net 
    - '[ -e /usr/bin/hexdump ] || ln -s "$(command -v hexdump)" /usr/bin/hexdump'

    # --- Build BerkeleyDB 4.8 
    - cd "$CI_PROJECT_DIR"
    - wget -O db-4.8.30.NC.tar.gz "https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz"
    - tar -xzvf db-4.8.30.NC.tar.gz
    # GCC 13 atomic clash patch 
    - sed -i 's/__atomic_compare_exchange/db___atomic_compare_exchange/g' db-4.8.30.NC/dbinc/atomic.h
    - cd db-4.8.30.NC/build_unix
    - ../dist/configure --enable-cxx --disable-shared --with-pic --prefix="$BDB_PREFIX"
    - make -j"$(nproc)"
    - make install
    - cd "$CI_PROJECT_DIR"
    - rm -rf db-4.8.30.NC db-4.8.30.NC.tar.gz

    # Env vars for egulden build
    - export BDB_CFLAGS="-I$BDB_PREFIX/include"
    - export BDB_LIBS="-L$BDB_PREFIX/lib -ldb_cxx-4.8"
    - export LD_LIBRARY_PATH="$BDB_PREFIX/lib:$LD_LIBRARY_PATH"

  script:
    - cd "$CI_PROJECT_DIR"
    - ./autogen.sh
    - ./configure \
        --with-boost-libdir=/usr/lib/x86_64-linux-gnu \
        --without-gui \
        --with-incompatible-bdb \
        CPPFLAGS="$BDB_CFLAGS" \
        LDFLAGS="$BDB_LIBS"
    - make -j"$(nproc)"
    - strip src/eguldend src/egulden-cli || true

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - src/eguldend
      - src/egulden-cli
      - config.log
      - config.status
